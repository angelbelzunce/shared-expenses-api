name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sharex_test
          POSTGRES_USER: sharex
          POSTGRES_PASSWORD: sharex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/sharex_test
      DB_USERNAME: sharex
      DB_PASSWORD: sharex
      JWT_SECRET: Y2ktb25seS1zZWNyZXQta2V5LWZvci10ZXN0cy0xMjM0NTY3OA==
      SHOW_SQL: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify

