spring:
  application:
    name: ingresos_y_gastos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ingresos_y_gastos_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Sin conexiones fijas: si nadie usa la app, el pool se vacía y Neon puede apagarse (scale to zero).
      minimum-idle: 0
      # Cierra cada conexión tras 1 minuto sin usarse.
      idle-timeout: 60000
  jpa:
    hibernate:
      # Flyway crea y cambia las tablas; Hibernate solo comprueba que coinciden con las entidades.
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    # La conexión a la base de datos se cierra al acabar el servicio, no al terminar de escribir la respuesta.
    open-in-view: false
  flyway:
    # La base local ya tenía las tablas: se marca como versión 1 sin ejecutar V1__init.sql.
    baseline-on-migrate: true
  config:
    import:
      optional:file:.env[.properties]

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
